[package]
name = "PS"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib", "rlib"]

[build]
target_arch = "wasm32"

[cfg]

target_arch = "wasm32"
# RUSTFLAGS = "--cfg=web_sys_unstable_apis"

[features]
profiling = []

[target.'cfg(target_arch = "wasm32")']
rustflags = [  "-C", "link-arg=-s",  "-C", "link-arg=--no-entry",  "-C", "link-arg=--export-table",  "-C", "link-arg=--import-memory",  "-C", "link-arg=--allow-undefined"]#"--cfg=web_sys_unstable_apis",

[dependencies]
flatbuffers = "24.3.25"
egui = "0.22.0"
egui_winit_platform= "0.19.0"
egui_wgpu_backend = "0.24.0"
egui_demo_lib = "0.22.0"
cpal = "0.15.3"
copypasta = "0.10.1"
# egui_code_editor = "0.1.0"
# egui_file = "0.16"
# eframe = "0.26"
cfg-if = "1"
claxon = "0.4.3"
rfd = "0.15.1"  
csv = "1.3.0"
winit = "0.28.3"
env_logger = "0.10.0"
log = "0.4.17"
serde = { version = "1.0.164", features = ["derive"] }
serde_json = "1.0.117"
wgpu = "=0.16.1"
naga = { version = "0.12.2", features = ["wgsl-in", "spv-out"] }
pollster = "0.3"
async-std = { version = "1.12", features = ["attributes", "tokio1"] }
rand = "0.8.5"
winit-fullscreen = "1.0.1"
chrono = "0.4.24"
cgmath = "0.18"
getrandom = { version = "0.2.9", features = ["js"] }
bytemuck = { version = "1.12", features = [ "derive" ] }
[dependencies.image]
version = "0.24"
default-features = false
features = ["png", "jpeg"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = "=0.16.1"
console_error_panic_hook = "0.1.0"
console_log = "1.0.0"
wasm-bindgen = "0.2.84"
wasm-bindgen-futures = "0.4.34"
web-sys = { version = "=0.3.64", features = [
    "Document",
    "Element",
    "Window",
]}

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
native-dialog = "0.7.0"
